server {
    listen 80;
    server_name cpatterns.lifesev.info;

    # ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name cpatterns.lifesev.info;

    ssl_certificate /etc/letsencrypt/live/cpatterns.lifesev.info/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cpatterns.lifesev.info/privkey.pem;

    # Basic hardening (safe defaults)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    client_max_body_size 100m;

    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
