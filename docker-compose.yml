services:
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_DB: patterns
      POSTGRES_USER: patterns
      POSTGRES_PASSWORD: patterns
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build: .
    restart: always
    depends_on:
      - db
    ports:
      - "127.0.0.1:8002:8000"
    # Project & dataset live in .env
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://patterns:patterns@db:5432/patterns
      # BigQuery credentials are provided via docker "secrets" below.
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/gcp_sa_key
    secrets:
      - gcp_sa_key

volumes:
  postgres_data:

secrets:
  gcp_sa_key:
    file: ./secrets/gcp_sa_key.json
