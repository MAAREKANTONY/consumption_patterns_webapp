version: "3.9"

services:
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_DB: patterns
      POSTGRES_USER: patterns
      POSTGRES_PASSWORD: patterns
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build: .
    restart: always
    depends_on:
      - db
    ports:
      - "127.0.0.1:8002:8000"
    environment:
      DATABASE_URL: postgresql://patterns:patterns@db:5432/patterns

volumes:
  postgres_data:
