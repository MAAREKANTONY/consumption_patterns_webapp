<!DOCTYPE html>
<html>
<head>
    <title>Patterns</title>
</head>
<body>
    <h2>Existing Patterns</h2>
    <ul>
    {% for p in patterns %}
        <li><strong>{{ p.name }}</strong> ({{ p.country }})</li>
    {% endfor %}
    </ul>

    <h2>Add Pattern</h2>
    <form method="post" action="/patterns">
        Name:<br>
        <input name="name"><br><br>
        Country:<br>
        <input name="country"><br><br>
        JSON Definition:<br>
        <textarea name="json_definition" rows="10" cols="70"></textarea><br><br>
        <button type="submit">Save</button>
    </form>
</body>
</html>
